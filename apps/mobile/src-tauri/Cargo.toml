[package]
name = "assistant-mobile-shell"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"

[lib]
name = "assistant_mobile_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
app-runtime = { path = "../../../crates/app-runtime" }

[target.'cfg(target_os = "android")'.dependencies]
assistant-contracts = { path = "../../../crates/contracts" }
assistant-core = { path = "../../../crates/assistant-core" }
storage-sqlite = { path = "../../../crates/storage-sqlite" }
provider-needle = { path = "../../../crates/provider-needle", features = ["native-static"] }
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
